<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        
    <meta name="description" content="CWA Help Desk Appointment">
    <meta name="keywords" content="CWA, Help Desk, Appointment">
    <meta name="author" content="Tran Hong Vy Ai">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CWA Help Desk Appointment</title>
</head>

<body>
    <a herf="https://www.swin.edu.au"><img src="images/logo.png" alt="Swinburne University of Technology"</a>

    <h1>CWA Help Desk Appointment</h1>

    <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday.</p>

    <p>Check Blackboard for when CWA tutors will be there.</p>


    <form action="result.html" method="post">
        <fieldset>
            <legend>Student Details</legend>

            <label for ="studentid">Studnet ID</label>
            <input type="text", id="studentid", name="Student ID", patern="^\d{7,10}$", required>
            <br><br>

            <label for="givenname">Given Name</label>
            <input type="text", id="givenname", name="Given Name", patern="^[A-Za-z]{1,15}$,", require>

            <label for="familyname"> Family Name</label>
            <input type="text", id="familyname", name="Family Name", patern="^[A-Za-z]{1,15}$", require>

        </fieldset>
        <br>

        <fieldset>
            <legend>Your Unit</legend>
            
            <label for="cos10026">COS10026</label>
            <input type="radio", id="COS10026", name="unit", value="COS10026", require>

            <label for="cos10011">COS10011</label>
            <input type="radio", id="COS10011", name="unit", value="COS10011">
            
            <label for="cos10011">COS10011</label>
            <input type="radio", id="COS10011", name="unit", value="COS10011">
            <br><br>

            <label for="tutor"> Your Tutor</label>
            <select id="tutor", name="Yor Tutor">
                <option value="">Please Select</option>
                <option value="tutor 1">Tutor 1</option>
                <option value="tutor 2">Tutor 2</option>
                <option value="tutor 3">Tutor 3</option>
                <option value="tutor 4">Tutor 4</option>
            </select>

        </fieldset>

        <fieldset>
            <legend>Issue</legend>

            <label for="html">HTML</label>
            <input type="checkbox", id="html", name="issue[]", value="HTML">
            
            <label for="css">CSS</label>
            <input type="checkbox", id="css", name="issue[]", value="HTML">

            <label for="javasrcipt">Javasrcipt</label>
            <input type="checkbox", id="javasrcipt", name="issue[]", value="HTML">
            
            <label for="PHP">PHP</label>
            <input type="checkbox", id="PHP", name="issue[]", value="HTML">

            <label for="mysql">My SQL</label>
            <input type="checkbox", id="mysql", name="issue[]", value="HTML">
            <br><br>

            <label for="description">Description of Issue</label>
            <br>

            <textarea id="description", name="description", placeholder="Write description of your problem here...", rows="4", cols="30"></textarea>         

        </fieldset>

        <fieldset>
            <legend>Preferred Date / Time</legend>

            <label for="date">Date</label>
            <input type="text", id="date", name="date", placeholder="dd/mm/yyyy", pattern="\d{2}/\d{2}/\d{4}", required>
            <br>

            <label for="time">Time</label>
            <input type="text", id="time", name="time", placeholder="hh:mm", pattern="^([01]?[0-9]|2[0-3]):[0-5][0-9]$", required>
        </fieldset>

        <input type="submit" value="Book">
        <input type="reset" value="Reset form">
    </form>

    
</body>
</html>
